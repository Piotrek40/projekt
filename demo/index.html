<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Dziedziniec</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; color: #fff; }
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #touch { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  #joy { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(255,255,255,.08); pointer-events: none; }
  #knob { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.6); }
  #hud { position: fixed; left: 8px; top: 8px; font: 12px/1.3 ui-monospace, monospace; background: rgba(0,0,0,.45); padding: 4px 6px; border-radius: 4px; pointer-events: none; }
  #gpu { position: fixed; left: 8px; bottom: 8px; font: 10px ui-monospace, monospace; opacity: .6; pointer-events: none; max-width: 60vw; }
  #q { position: fixed; right: 8px; bottom: 8px; font: 12px ui-monospace, monospace; background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,.3); z-index: 3; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #111; z-index: 5; font-size: 16px; text-align: center; padding: 20px; }
  #loading[hidden] { display: none; }
  #loading small { display: block; opacity: .6; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch"><div id="joy" hidden><div id="knob"></div></div></div>
<div id="hud">…</div>
<div id="gpu"></div>
<button id="q">medium</button>
<div id="loading">Ładowanie sceny…<small>Postęp: <span id="progress">0 / 0</span></small><small>Lewa część ekranu: joystick (chodzenie). Prawa: przeciągnij, żeby się rozejrzeć. Przycisk w rogu zmienia jakość.</small></div>
<script type="module" src="./app.js"></script>
</body>
</html>
